<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vaulta — Your private, offline document manager. Organize, search, and share personal and official documents from one place." />
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:title" content="Vaulta — Personal Document Manager" />
  <meta property="og:description" content="Organize, search, and share your personal & official documents privately." />
  <meta property="og:type" content="website" />

  <title>Vaulta — Personal Document Manager</title>

  <!-- Web App Manifest & PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" href="icons/icon-192.png" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <span class="logo-text">Vault<span class="text-gradient">a</span></span>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="installPwaBtn" title="Install App on Phone" aria-label="Install App" style="display: none;">📲 Install App</button>
        <button class="header-btn" id="backupBtn" title="Export Backup" aria-label="Export backup">💾</button>
        <button class="header-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle dark/light theme">☀️</button>
      </div>
    </div>
  </header>

  <!-- Main Application Container -->
  <main id="app" role="main">
    <!-- Screens are rendered here dynamically -->
  </main>

  <!-- Modals Container -->
  <div id="modals" aria-live="polite">
    <!-- Modals (upload, preview, edit, delete) are injected here -->
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  <!-- PDF.js library for rendering PDFs on mobile and desktop -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Scripts (order matters: db → search → share → ui → app) -->
  <script src="js/db.js"></script>
  <script src="js/search.js"></script>
  <script src="js/share.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Initialize the app & PWA Service Worker
    document.addEventListener('DOMContentLoaded', () => {
      DocApp.init();

      // Theme toggle
      document.getElementById('themeToggle').addEventListener('click', DocApp.toggleTheme);

      // Set initial theme icon
      const theme = document.documentElement.getAttribute('data-theme');
      document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('[PWA] Service Worker registered successfully:', reg.scope))
          .catch((err) => console.error('[PWA] Service Worker registration failed:', err));
      }

      // Handle Install Prompt Banner for Android/Chrome
      let deferredPrompt = null;
      const installBtn = document.getElementById('installPwaBtn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = 'inline-flex';
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('[PWA] Install prompt outcome:', outcome);
          deferredPrompt = null;
          installBtn.style.display = 'none';
        });
      }
    });
  </script>

</body>
</html>

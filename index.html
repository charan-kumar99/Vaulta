<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Vaulta — Your private, offline document manager. Organize, search, and share personal and official documents from one place." />
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta property="og:title" content="Vaulta — Personal Document Manager" />
  <meta property="og:description" content="Organize, search, and share your personal & official documents privately." />
  <meta property="og:type" content="website" />

  <title>Vaulta — Personal Document Manager</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-mark" aria-hidden="true">
          <svg class="logo-v-svg" viewBox="0 0 34 34" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="vGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f5ff" />
                <stop offset="55%" stop-color="#0091ff" />
                <stop offset="100%" stop-color="#0062ff" />
              </linearGradient>
              <linearGradient id="vGradRight" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#0062ff" />
                <stop offset="50%" stop-color="#4f46e5" />
                <stop offset="100%" stop-color="#818cf8" />
              </linearGradient>
              <filter id="vGlowFilter" x="-25%" y="-25%" width="150%" height="150%">
                <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#00e5ff" flood-opacity="0.45" />
              </filter>
            </defs>
            <g filter="url(#vGlowFilter)">
              <path d="M 6.5 7 L 14.8 24.5 C 15.7 26.4 18.3 26.4 19.2 24.5 L 27.5 7" 
                    stroke="url(#vGradLeft)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M 17 25.5 L 27.5 7" 
                    stroke="url(#vGradRight)" stroke-width="5.2" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
        <span class="logo-text">Vault<span class="text-gradient">a</span></span>
        <span class="security-status-badge"><span class="status-dot"></span> Offline Vault</span>
      </div>
      <div class="header-actions">
        <button class="header-btn install-pwa-btn" id="installPwaBtn" title="Install App on Phone" aria-label="Install App" style="display: none;">
          <svg class="btn-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span class="btn-text">Install</span>
        </button>
        <button class="header-btn mobile-hidden" id="notifyBtn" onclick="DocApp.requestNotificationPermission()" title="Enable Desktop Notifications" aria-label="Desktop Notifications">
          <svg class="btn-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
        <button class="header-btn mobile-hidden" id="securityLockBtn" onclick="DocUI.renderSecurityModal()" title="Security & App Lock" aria-label="Security settings">
          <svg class="btn-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
        <button class="header-btn mobile-hidden" id="backupBtn" title="Export Backup" aria-label="Export backup">
          <svg class="btn-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
        <button class="header-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle dark/light theme">
          <svg class="btn-svg" id="themeToggleIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" role="main"></main>

  <div id="modals" aria-live="polite"></div>

  <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  <!-- Bottom Navigation Bar (mobile only, hidden via CSS on desktop) -->
  <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation">
    <button class="bottom-nav-tab active" id="navHome" data-nav="home">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </span>
      <span class="nav-label">Home</span>
    </button>
    <button class="bottom-nav-tab" id="navVaults" data-nav="vaults">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      </span>
      <span class="nav-label">Vaults</span>
    </button>
    <button class="bottom-nav-fab" id="navFab" data-nav="upload" aria-label="Upload document">
      <div class="fab-center">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
    </button>
    <button class="bottom-nav-tab" id="navSearch" data-nav="search">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <span class="nav-label">Search</span>
    </button>
    <button class="bottom-nav-tab" id="navSettings" data-nav="settings">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </span>
      <span class="nav-label">Settings</span>
    </button>
  </nav>

  <script src="js/db.js"></script>
  <script src="js/search.js"></script>
  <script src="js/share.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/security.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      DocApp.init();

      if (window.SecurityModule) {
        window.SecurityModule.init();
      }

      const secBtn = document.getElementById('securityLockBtn');
      if (secBtn) {
        secBtn.addEventListener('click', () => {
          if (window.DocUI && typeof window.DocUI.renderSecurityModal === 'function') {
            window.DocUI.renderSecurityModal();
          }
        });
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && window.SecurityModule && window.SecurityModule.isSecurityEnabled()) {
          if (!window.SecurityModule.isLockSuppressed()) {
            window.SecurityModule.lockApp();
          }
        }
      });

      const backupBtn = document.getElementById('backupBtn');
      if (backupBtn) {
        backupBtn.addEventListener('click', () => {
          if (window.DocShare && typeof window.DocShare.exportDataPackage === 'function') {
            window.DocShare.exportDataPackage();
          } else {
            DocUI.showToast('Backup feature initialized', 'info');
          }
        });
      }

      document.getElementById('themeToggle').addEventListener('click', DocApp.toggleTheme);

      const theme = document.documentElement.getAttribute('data-theme');
      document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .catch((err) => console.error(err));
      }

      let deferredPrompt = null;
      const installBtn = document.getElementById('installPwaBtn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = 'inline-flex';
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          installBtn.style.display = 'none';
        });
      }
    });
  </script>

</body>
</html>
